name: Build and deploy Reign of Metal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Reign of Metal
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download pinned WebSonic engine
        env:
          WEBSONIC_COMMIT: 356bf6ce9760076f060a458075219f2f22e2162a
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/coreh-deprecated/WebSonic/archive/${WEBSONIC_COMMIT}.zip" \
            --output /tmp/websonic.zip
          mkdir -p /tmp/websonic
          unzip -q /tmp/websonic.zip -d /tmp/websonic
          mkdir -p engine/websonic
          cp -a "/tmp/websonic/WebSonic-${WEBSONIC_COMMIT}/." engine/websonic/
          test -f engine/websonic/LICENSE
          test -f engine/websonic/index.html
          echo "WebSonic source staged from ${WEBSONIC_COMMIT}"

      - name: Install Reign of Metal factory materials
        run: |
          set -euo pipefail
          test -f assets/factory-floor.svg
          test -f assets/factory-wall.svg
          python3 -m pip install --disable-pip-version-check --quiet cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          floor = Path("assets/factory-floor.svg")
          wall = Path("assets/factory-wall.svg")
          texture_dir = Path("engine/websonic/texture")
          texture_dir.mkdir(parents=True, exist_ok=True)
          cairosvg.svg2png(url=str(floor), write_to=str(texture_dir / "reign-factory-floor.png"), output_width=512, output_height=512)
          cairosvg.svg2png(url=str(wall), write_to=str(texture_dir / "reign-factory-wall.png"), output_width=512, output_height=512)
          mesh = Path("engine/websonic/mesh/lvl0.jsonmesh")
          source = mesh.read_text()
          floor_old = '"texture/wall.png"'
          wall_old = '"texture/wall2.png"'
          if source.count(floor_old) != 1 or source.count(wall_old) != 8:
              raise SystemExit("Unexpected WebSonic mesh texture layout; refusing unsafe replacement")
          source = source.replace(floor_old, '"texture/reign-factory-floor.png"')
          source = source.replace(wall_old, '"texture/reign-factory-wall.png"')
          mesh.write_text(source)
          import json
          json.loads(source)
          print("Rendered factory SVG artwork to WebGL-compatible PNG textures")
          print("Verified 1 floor material and 8 wall material assignments")
          PY

      - name: Install Reign of Metal level blockout
        run: |
          set -euo pipefail
          test -f levels/eggmans-factory.jsonlevel
          cp levels/eggmans-factory.jsonlevel engine/websonic/level/lvl0.jsonlevel
          echo "Installed Eggman's Factory blockout as the WebSonic starting level"

      - name: Install Reign of Metal gameplay systems
        run: |
          set -euo pipefail
          test -f gameplay/reign-of-metal.js
          cp gameplay/reign-of-metal.js engine/websonic/js/reign-of-metal.js
          python3 - <<'PY'
          from pathlib import Path
          index = Path("engine/websonic/index.html")
          html = index.read_text()
          main_tag = '<script src="js/main.js"></script>'
          if html.count(main_tag) != 1:
              raise SystemExit("Unexpected WebSonic script layout; refusing gameplay script patch")
          html = html.replace(main_tag, '<script src="js/reign-of-metal.js"></script>' + chr(10) + '  ' + main_tag)
          index.write_text(html)

          main = Path("engine/websonic/js/main.js")
          source = main.read_text()
          player_add = 'engine.world.add(player);'
          if source.count(player_add) != 1:
              raise SystemExit("Unexpected WebSonic player initialization; refusing gameplay hook patch")
          source = source.replace(player_add, player_add + chr(10) + chr(9) * 7 + 'if (window.ReignOfMetal) window.ReignOfMetal.start(engine, player);')
          default_spring = 'engine.world.add(new Spring(engine, player));'
          if source.count(default_spring) != 1:
              raise SystemExit("Unexpected WebSonic default spring setup; refusing spring placement patch")
          source = source.replace(default_spring, '// Reign of Metal places native springs along the factory route.')
          main.write_text(source)
          print("Installed Reign of Metal rings and route-based native springs")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
