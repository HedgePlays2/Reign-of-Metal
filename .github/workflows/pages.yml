name: Build and deploy Reign of Metal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Reign of Metal
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download pinned WebSonic engine
        env:
          WEBSONIC_COMMIT: 356bf6ce9760076f060a458075219f2f22e2162a
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/coreh-deprecated/WebSonic/archive/${WEBSONIC_COMMIT}.zip" \
            --output /tmp/websonic.zip
          mkdir -p /tmp/websonic
          unzip -q /tmp/websonic.zip -d /tmp/websonic
          mkdir -p engine/websonic
          cp -a "/tmp/websonic/WebSonic-${WEBSONIC_COMMIT}/." engine/websonic/
          test -f engine/websonic/LICENSE
          test -f engine/websonic/index.html
          echo "WebSonic source staged from ${WEBSONIC_COMMIT}"

      - name: Install Reign of Metal factory materials
        run: |
          set -euo pipefail
          test -f assets/factory-floor.svg
          test -f assets/factory-wall.svg
          cp assets/factory-floor.svg engine/websonic/texture/reign-factory-floor.svg
          cp assets/factory-wall.svg engine/websonic/texture/reign-factory-wall.svg
          python3 - <<'PY'
          from pathlib import Path
          loader = Path("engine/websonic/js/ResourceManager.js")
          loader_source = loader.read_text()
          needle = 'case "bmp":'
          if loader_source.count(needle) != 1:
              raise SystemExit("Unexpected WebSonic resource loader; refusing safe SVG patch")
          loader_source = loader_source.replace(needle, 'case "svg": // Reign of Metal vector textures\\n\\t\\t\\t' + needle)
          loader.write_text(loader_source)
          print("Enabled SVG texture loading in WebSonic ResourceManager")
          mesh = Path("engine/websonic/mesh/lvl0.jsonmesh")
          source = mesh.read_text()
          floor_old = '"texture/wall.png"'
          wall_old = '"texture/wall2.png"'
          if source.count(floor_old) != 1 or source.count(wall_old) != 8:
              raise SystemExit("Unexpected WebSonic mesh texture layout; refusing unsafe replacement")
          source = source.replace(floor_old, '"texture/reign-factory-floor.svg"')
          source = source.replace(wall_old, '"texture/reign-factory-wall.svg"')
          mesh.write_text(source)
          print("Applied Reign of Metal floor and wall materials to WebSonic surfaces")
          PY

      - name: Install Reign of Metal level blockout
        run: |
          set -euo pipefail
          test -f levels/eggmans-factory.jsonlevel
          cp levels/eggmans-factory.jsonlevel engine/websonic/level/lvl0.jsonlevel
          echo "Installed Eggman's Factory blockout as the WebSonic starting level"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
